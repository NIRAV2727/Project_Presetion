<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ask a Question</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

display:flex;
justify-content:center;
align-items:center;
height:100vh;

background:linear-gradient(135deg,#1e3c72,#2a5298);

}

.container{

width:420px;
padding:35px;

background:rgba(255,255,255,.12);

backdrop-filter:blur(15px);

border-radius:20px;

box-shadow:0 15px 35px rgba(0,0,0,.35);

color:white;

}

.container h1{

text-align:center;
margin-bottom:10px;

}

.container p{

text-align:center;
opacity:.8;
margin-bottom:25px;

}

label{

font-weight:600;
display:block;
margin-top:15px;
margin-bottom:6px;

}

input,
textarea{

width:100%;
padding:14px;

border:none;

outline:none;

border-radius:12px;

background:rgba(255,255,255,.18);

color:white;

font-size:15px;

}

input::placeholder,
textarea::placeholder{

color:#ddd;

}

textarea{

height:130px;
resize:none;

}

button{

margin-top:25px;

width:100%;

padding:15px;

background:#00d4ff;

color:white;

font-size:18px;

font-weight:bold;

border:none;

border-radius:12px;

cursor:pointer;

transition:.3s;

}

button:hover{

background:#00a8cc;
transform:translateY(-3px);

}

.footer{

margin-top:18px;
text-align:center;
font-size:13px;
opacity:.8;

}

</style>

</head>

<body>

<div class="container">

<h1>💬 Ask Your Question</h1>

<p>Scan QR Code & Submit Your Question</p>

<form action="https://formspree.io/f/xdaqwkdk" method="POST">

<label>Email</label>

<input
type="email"
name="email"
placeholder="Enter your email"
required>

<label>Your Question</label>

<textarea
name="message"
placeholder="Type your question here..."
required></textarea>

<button type="submit">
📨 Submit Question
</button>

</form>

<div class="footer">

Created by <b>Niravbhai Savaliya</b>

</div>

</div>

</body>
</html>
